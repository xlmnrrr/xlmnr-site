<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="XLMNR — создание сайтов и лендингов, которые приносят клиентов.">
  <title>XLMNR | Сайт в разработке</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121212'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='22' fill='%23c26a4a'%3EX%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#121212; --text:#f5f2eb; --text-muted:#a3a3a3; --accent:#c26a4a; --font-display:Georgia,"Times New Roman",serif; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
    .card { max-width:520px; }
    .mark { font-family:var(--font-display); letter-spacing:0.14em; color:var(--accent); font-size:14px; margin-bottom:20px; }
    h1 { font-family:var(--font-display); font-weight:400; font-size:clamp(2rem,6vw,3.2rem); margin-bottom:14px; line-height:1.15; }
    p { color:var(--text-muted); font-size:17px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">XLMNR</div>
    <h1>Сайт в разработке</h1>
    <p>Скоро здесь откроется студия. Загляните чуть позже.</p>
  </div>
</body>
</html>
