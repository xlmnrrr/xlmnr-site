<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="XLMNR — создание сайтов и лендингов, которые приносят клиентов. Дорогой дизайн, быстрая загрузка, заявки в Telegram.">
  <title>XLMNR | Сайты, которые приносят клиентов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121212'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,Times New Roman,serif' font-weight='700' font-size='22' fill='%23c26a4a'%3EX%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121212'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,Times New Roman,serif' font-weight='700' font-size='22' fill='%23c26a4a'%3EX%3C/text%3E%3C/svg%3E">
  
  <style>
    /* ================= БАЗА ================= */
    :root {
      --bg: #121212;
      --surface: #1a1a1a;
      --text: #f5f2eb;
      --text-muted: #a3a3a3;
      --accent: #c26a4a;
      --border: rgba(255,255,255,0.08);
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    
    body { 
      font-family: var(--font-body); 
      background: #121212;
      color: var(--text); 
      line-height: 1.6; 
      overflow-x: clip; 
    }
    img, svg, video { max-width: 100%; height: auto; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    
    h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; letter-spacing: -0.02em; }
    h1 { font-size: clamp(1.85rem, 7vw, 4.5rem); margin-bottom: 20px; text-wrap: balance; }
    h2 { font-size: clamp(1.7rem, 5vw, 3rem); margin-bottom: 15px; text-align: center; text-wrap: balance; }
    h2 span { font-style: italic; color: var(--accent); }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 3; }
    
    section { 
      padding: clamp(56px, 8vw, 100px) 0; 
      position: relative; 
      scroll-margin-top: 88px;
    }
    .section-subtitle { text-align: center; color: var(--text-muted); max-width: 600px; margin: 0 auto 60px; font-size: 18px; }

    /* ================= ФОН ================= */
    .code-bg-section {
      position: relative;
      overflow: hidden;
    }
    .css-code-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      opacity: 0.35;
    }
    
    .code-column-wrapper {
      position: absolute;
      top: 0;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      will-change: transform, opacity;
    }
    
    @keyframes softAppear {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .code-column {
      display: block;
      font-size: 13px;
      line-height: 1.85;
    }
    .code-content {
      display: block;
    }
    .code-line {
      display: block;
      white-space: nowrap;
      overflow: hidden;
    }
    .code-char {
      display: inline-block;
      opacity: 0;
      animation: charType 0.12s ease-out forwards;
    }
    .code-char.orange { color: rgba(194, 106, 74, 0.85); }
    .code-char.white { color: rgba(245, 242, 235, 0.72); }
    .code-char.dim { color: rgba(194, 106, 74, 0.4); }
    @keyframes charType {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .code-bg-section.is-visible .code-column-wrapper {
      animation:
        softAppear 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
        floatDrift var(--float-dur, 14s) ease-in-out var(--float-delay, 0s) infinite alternate;
    }
    @keyframes floatDrift {
      0%   { transform: translate3d(0, 0, 0); }
      50%  { transform: translate3d(0, -18px, 0); }
      100% { transform: translate3d(0, 12px, 0); }
    }

    /* ================= ШАПКА ================= */
    .header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(18, 18, 18, 0.96); border-bottom: 1px solid var(--border); transform: translateY(-100%); transition: transform 0.4s ease-out; padding-top: env(safe-area-inset-top); }
    .header.show { transform: translateY(0); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 12px; position: relative; }
    .nav-toggle { display: none; width: 44px; height: 44px; border: 1px solid var(--border); background: transparent; border-radius: 6px; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0; }
    .nav-toggle span { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; }
    .logo { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: 0.05em; }
    .logo span { color: var(--accent); }
    .nav { display: flex; gap: 30px; }
    .nav a { color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.3s; }
    .nav a:hover { color: var(--text); }
    .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; padding: 14px 28px; border-radius: 4px; font-size: 15px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: background-color 0.3s, transform 0.3s; white-space: nowrap; min-height: 44px; }
    .header-cta { padding: 10px 16px; }
    .nav-cta { display: none; }
    .btn:hover { background: #a65539; transform: translateY(-2px); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--surface); border-color: var(--text-muted); }

    /* ================= ГЛАВНЫЙ ЭКРАН ================= */
    .hero { min-height: 100svh; display: flex; align-items: center; padding-top: 88px; padding-bottom: 40px; text-align: center; }
    .hero p { font-size: clamp(1.1rem, 2vw, 1.3rem); color: var(--text-muted); margin-bottom: 40px; max-width: 600px; margin-inline: auto; }
    .hero-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

    /* ================= АНИМАЦИИ БЛОКОВ ================= */
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    .reveal.in { opacity: 1; transform: translateY(0); }

    /* rest of styles and body will be restored from full file */
  </style>
</head>
<body>
  <p style="color:#fff;padding:40px;text-align:center">Временно повреждённый деплой — восстанавливаю полный index.html…</p>
</body>
</html>
