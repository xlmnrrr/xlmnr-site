<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>XLMNR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121212'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='22' fill='%23c26a4a'%3EX%3C/text%3E%3C/svg%3E">
  <style>
    body { margin:0; background:#121212; color:#f5f2eb; font-family:system-ui,sans-serif; }
    .boot { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    .boot p { color:#a3a3a3; font-size:14px; }
  </style>
</head>
<body>
  <div class="boot" id="boot"><div style="font-family:Georgia,serif;letter-spacing:0.14em;color:#c26a4a">XLMNR</div><p>Загрузка…</p></div>
  <script>
  (async function () {
    function b64ToU8(s) {
      var bin = atob(s);
      var u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8;
    }
    try {
      var parts = await Promise.all([fetch('/site1.b64'), fetch('/site2.b64')]);
      var b64 = ((await parts[0].text()) + (await parts[1].text())).replace(/\s/g, '');
      var ds = new DecompressionStream('gzip');
      var stream = new Blob([b64ToU8(b64)]).stream().pipeThrough(ds);
      var html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('boot').innerHTML = '<p style="color:#ef4444">Ошибка загрузки. Обновите браузер.</p>';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
